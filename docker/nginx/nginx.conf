# Routes the SPA at "/" and only proxies backend-shaped paths to Frappe,
# per docs/ARCHITECTURE.md — clinical/business users never see Desk unless
# they explicitly navigate to /app as Administrator/System Manager.

upstream frontend_upstream {
	server frontend:3000;
}

upstream backend_upstream {
	server backend:8000;
}

upstream websocket_upstream {
	server websocket:9000;
}

server {
	listen 80;
	client_max_body_size 50m;

	# Frappe's compiled static assets (Desk JS/CSS, uploaded public files),
	# served directly off the shared `sites` volume rather than proxied.
	location /assets {
		alias /home/frappe/frappe-bench/sites/assets;
		try_files $uri =404;
	}

	# The Next.js SPA's own API rewrite target (see frontend/next.config.ts)
	# — also reachable directly for any client that bypasses the rewrite.
	location /backend-api/ {
		rewrite ^/backend-api/(.*)$ /api/$1 break;
		proxy_pass http://backend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /api/ {
		proxy_pass http://backend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# Desk — Administrator/System Manager low-level configuration only.
	location /app {
		proxy_pass http://backend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /socket.io/ {
		proxy_pass http://websocket_upstream;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
	}

	# Everything else: the Next.js SPA.
	location / {
		proxy_pass http://frontend_upstream;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
